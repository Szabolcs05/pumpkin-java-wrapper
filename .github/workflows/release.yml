name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse('pom.xml').getroot()
          version = root.findtext('{http://maven.apache.org/POM/4.0.0}version')
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit(f'Tag must be v{version}, matching pom.xml')
          PY
      - name: Test and build
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Smoke-test executable JAR
        run: java -jar target/pumpkin-java-wrapper.jar --help
      - name: Package corresponding source and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release/source
          git archive --format=tar HEAD | tar -xf - -C release/source
          ./mvnw --batch-mode --no-transfer-progress \
            org.apache.maven.plugins:maven-dependency-plugin:3.11.0:copy-dependencies \
            -DincludeScope=runtime \
            -Dclassifier=sources -DfailOnMissingClassifierArtifact=true \
            -DoutputDirectory="${PWD}/release/source/third-party/sources"
          cp target/pumpkin-java-wrapper.jar release/pumpkin-java-wrapper.jar
          (cd release/source && zip -qr ../pumpkin-java-wrapper-source.zip .)
          (cd release && sha256sum pumpkin-java-wrapper.jar pumpkin-java-wrapper-source.zip > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/pumpkin-java-wrapper.jar \
            release/pumpkin-java-wrapper-source.zip \
            release/SHA256SUMS \
            --verify-tag --title "Pumpkin Java Wrapper $RELEASE_TAG" --generate-notes
